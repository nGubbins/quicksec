[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quicksec"
version = "0.1.0"
description = "Quick security info for a given URL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "N G", email = "nickwgubbins@gmail.com" }]
dependencies = ["requests>=2.28"]

[project.scripts]
quicksec = "quicksec:main"

[tool.setuptools.packages.find]
where = ["src"]
