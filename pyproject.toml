[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quicksec"
version = "0.1.2"
description = "Quick security info for a given URL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lost_0", email = "l05t_0@proton.me" }]
dependencies = ["requests>=2.28"]

[project.scripts]
quicksec = "quicksec:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["quicksec"]
